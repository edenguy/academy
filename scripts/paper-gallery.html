<!doctype html>
<!-- Dev-only gallery of the Paper layer (BACKGROUND_LLD.md §11.3). Open it from the file system; never served,
     never under docs/. Phase 0 shows two sample payloads, light and dark; the hub's catalog replaces them in Phase 1d. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper gallery</title>
<style>
  :root { --napkin:#ffffff; --napkin-edge:rgba(60,40,140,.22); --napkin-shadow:rgba(23,16,43,.13); --paper-grid:rgba(60,40,140,.09); --paper-grid5:rgba(60,40,140,.2);
          --paper-ink-1:#5b3df5; --paper-ink-2:#0b857c; --paper-ink-3:#c93a80; --paper-text:#463c6a; --paper-ink-alpha:.8; --napkin-cells:12; --bg:#f3f0fb; --ink:#17102b; }
  .dark { --napkin:#16103a; --napkin-edge:rgba(173,160,255,.34); --napkin-shadow:rgba(0,0,0,.45); --paper-grid:rgba(173,160,255,.12); --paper-grid5:rgba(173,160,255,.28);
          --paper-ink-1:#9a82ff; --paper-ink-2:#2fd4c6; --paper-ink-3:#ff7ec4; --paper-text:#c6bdea; --bg:#0d0924; --ink:#eee9ff; }
  body { margin:0; font:14px system-ui, sans-serif; }
  .row { background:var(--bg); color:var(--ink); padding:16px; display:grid; grid-template-columns:repeat(auto-fill, 360px); gap:12px; }
  .cell { position:relative; width:360px; height:300px; outline:1px dashed #8886; direction:ltr; }
  .academy-paper { position:absolute; inset:0; width:100%; height:100%; }
  .cell b { position:absolute; left:6px; top:4px; font:11px ui-monospace, monospace; }
</style>
</head>
<body>
<div class="row" id="light"></div>
<div class="row dark" id="dark"></div>
<script src="../docs/hub/paper-engine.js"></script>
<script>
  // Two sample payloads, in the napkin's own coordinates (u: -1..1 left to right, w: -1..1 top to bottom).
  const ux = (x) => -0.7 + (x / 3) * 1.45, wy = (y) => 0.66 - (y / 9.5) * 1.02;
  const label = (pen, m) => pen.label(m, 0, -0.72, 0.2, { alpha: Math.min(1, Math.max(0, (pen.t - 0.55) / 0.3)) });
  const payloads = [
    { id: 'S1', tier: 'A', check: () => true, draw(pen) {   // x^2 on [0, 3], as Math's M1 (without the bars)
      pen.style(pen.ink(2), 1.3, 0.55); pen.arrow(-0.78, wy(0), 0.82, wy(0)); pen.arrow(ux(0), 0.74, ux(0), -0.42);
      pen.style(pen.ink(0), 2.6); pen.curve((u) => wy(((u + 0.7) / 1.45 * 3) ** 2), ux(0), ux(3), pen.t, 40);
      label(pen, '∫_{0}^{3} x^{2} dx = 9'); } },
    { id: 'S2', tier: 'B', check: () => true, draw(pen) {   // a vector and its parts, as Physics' P10
      pen.style(pen.ink(2), 1.3, 0.55); pen.arrow(-0.7, 0.55, 0.8, 0.55); pen.arrow(-0.7, 0.55, -0.7, -0.4);
      pen.style(pen.ink(0), 2.4); pen.arrow(-0.7, 0.55, 0.4, -0.15 * pen.t);
      pen.style(pen.ink(1), 1.6); pen.dash(-0.7, 0.55, 0.4, 0.55); pen.dash(0.4, 0.55, 0.4, -0.15);
      label(pen, 'v^{2} = v_{x}^{2} + v_{y}^{2}'); } },
  ];
  for (const id of ['light', 'dark']) {
    const row = document.getElementById(id);
    payloads.forEach((p, i) => {
      const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.side = 'left'; row.appendChild(cell);
      const tag = document.createElement('b'); tag.textContent = p.id + ' ' + id; cell.appendChild(tag);
      AcademyPaper.mount(cell, { flow: 'y', payloads, count: 1, font: "ui-monospace, 'JetBrains Mono', monospace", only: i, seed: 4 });
    });
  }
</script>
</body>
</html>
